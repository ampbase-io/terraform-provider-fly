receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: vault
          metrics_path: /v1/sys/metrics
          params:
            format: ["prometheus"]
          static_configs:
            - targets: ["127.0.0.1:8200"]
exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]
