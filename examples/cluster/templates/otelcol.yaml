receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: clickhouse
          static_configs:
            - targets: ["127.0.0.1:9363"]
exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]
