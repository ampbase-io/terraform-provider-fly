name: spec-refresh

# Refreshes the Machines API document from Fly and regenerates the client
# and docs, opening a PR when anything changed. Weekly, and on demand.
#
# A PR opened with GITHUB_TOKEN does not trigger the ci workflow's
# pull_request event, so the last step dispatches ci on the branch instead:
# workflow_dispatch runs are the one kind GITHUB_TOKEN may start, and their
# checks attach to the branch head the PR shows.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Refresh the spec and regenerate
        run: |
          go run ./hack/spec
          go generate ./...
          go build ./...
      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: spec-refresh
          title: "machines: refresh the Machines API spec"
          commit-message: "machines: refresh the Machines API spec"
          body: |
            Automated refresh of `flyio/machines/fly-machines.openapi3.json`
            from https://docs.machines.dev/openapi.json, with the client and
            docs regenerated. Review the `gen.go` diff for shape changes on
            the types the resources use before merging.
          labels: spec-refresh
      - name: Run ci on the PR branch
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref spec-refresh
