name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by spec-refresh on the branch it opens a PR from: a PR created
  # with GITHUB_TOKEN does not trigger pull_request, but a dispatch always
  # creates a run, and its checks attach to the branch head the PR shows.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod tidy && git diff --exit-code go.mod go.sum
        name: Check go.mod tidiness
      - run: test -z "$(gofmt -l .)"
        name: gofmt
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - run: go test ./...
      - run: go build .
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - run: git diff --exit-code docs/
        name: Generated docs are committed
