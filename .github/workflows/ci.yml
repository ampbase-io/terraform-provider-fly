name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by spec-refresh on the branch it opens a PR from: a PR created
  # with GITHUB_TOKEN does not trigger pull_request, but a dispatch always
  # creates a run, and its checks attach to the branch head the PR shows.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod tidy && git diff --exit-code go.mod go.sum
        name: Check go.mod tidiness
      - run: test -z "$(gofmt -l .)"
        name: gofmt
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - run: go test ./...
      - run: go build .
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - run: git diff --exit-code docs/
        name: Generated docs are committed
  # Every directory under examples/ that is a root module is validated against
  # the provider built from this commit, through a dev override, so an example
  # that drifts from the schema fails here rather than in a reader's terminal.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false
      - name: Build the provider for a dev override
        run: |
          mkdir -p "$RUNNER_TEMP/provider"
          go build -o "$RUNNER_TEMP/provider/terraform-provider-fly" .
          cat > "$RUNNER_TEMP/tofurc" <<EOF
          provider_installation {
            dev_overrides {
              "registry.terraform.io/ampbase-io/fly" = "$RUNNER_TEMP/provider"
            }
            direct {}
          }
          EOF
      - name: Validate every example root
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/tofurc
        run: |
          tofu fmt -check -recursive examples/
          for dir in examples/*/; do
            [ -f "$dir/main.tf" ] || continue
            echo "== $dir"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done
